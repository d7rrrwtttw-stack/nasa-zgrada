<!doctype html>
<html lang="sr-Latn-ME">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Naša zgrada</title>
<meta name="theme-color" content="#0f3d3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Naša zgrada">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f1ec;--card:#fff;--ink:#1c2321;--muted:#6b7570;--line:#e3e0d8;
  --pri:#0f3d3e;--pri2:#155e5f;--acc:#d98e32;--red:#b3372f;--green:#2f7d4f;
  --r:14px;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:16px}
small{display:block;color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.err{color:var(--red);padding:16px}
.hidden{display:none!important}
.r{text-align:right;white-space:nowrap}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:28px 22px;box-shadow:var(--sh);text-align:center}
.auth-card h1{font-size:24px;margin:10px 0 4px}
.auth-card form{text-align:left;margin-top:20px}
.logo svg{width:56px;height:56px}
.msg{min-height:20px;font-size:13px;color:var(--pri2);text-align:center;margin:10px 0 0}
.link{background:none;border:0;color:var(--pri2);padding:8px 0;width:100%;cursor:pointer;font-size:13px}

/* shell */
.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:#b9cfcf}
.top .btns{display:flex;gap:6px;flex:none}
.top .btn{background:rgba(255,255,255,.12);color:#fff;border:0}
.tabs{position:sticky;top:calc(env(safe-area-inset-top) + 56px);z-index:4;background:var(--bg);
  display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:980px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.loading{padding:40px;text-align:center;color:var(--muted)}

/* components */
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{background:#fff;border-color:var(--red);color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%;margin-top:8px;padding:12px}
.btn:disabled{opacity:.5}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.bar input,.bar select{flex:1 1 140px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat b{display:block;font-size:22px;margin:4px 0 2px}
.stat.big{grid-column:1/-1;background:var(--pri);color:#fff}
.stat.big span,.stat.big small{color:#b9cfcf}
.stat.big b{font-size:30px}
.stat.warn b{color:var(--red)}
.stat.ok b{color:var(--green)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 14px 10px}
.card-body{padding:0 14px 14px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;background:#faf9f6}
tr.click{cursor:pointer}
tr.click:active{background:#f6f4ef}
tr.off td{opacity:.5}
tfoot td{font-weight:700;background:#faf9f6}
@media(max-width:480px){th,td{padding:9px 6px}th:first-child,td:first-child{padding-left:14px}th:last-child,td:last-child{padding-right:14px}}
.empty{padding:24px 14px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.badge.red{background:#f8e3e1;color:var(--red)}
.badge.green{background:#e1f1e7;color:var(--green)}
.badge.grey{background:#eeece7;color:var(--muted)}
.neg{color:var(--red)}.pos{color:var(--green)}
.hint{font-size:13px;color:var(--muted);margin:4px 0 12px}
.x-del{background:none;border:0;color:var(--red);font-size:18px;cursor:pointer;padding:0 4px}

/* forms */
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);outline-offset:-1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;margin:6px 0 12px;font-size:14px}
.check input{width:auto}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.actions .btn{flex:1}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(15,25,25,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}
.sheet .card{box-shadow:none;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-bottom:12px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw}
.toast.bad{background:var(--red)}

/* print */
#print{display:none}
@media print{
  body.printing #app,body.printing .modal,body.printing .toast{display:none!important}
  body.printing #print{display:block}
  body{background:#fff}
}
.doc{font:12px/1.4 Arial,Helvetica,sans-serif;color:#000;padding:10mm}
.doc h1{font-size:18px;margin:0 0 4px}
.doc h2{font-size:14px;margin:14px 0 6px}
.doc table{width:100%;border-collapse:collapse;margin:6px 0}
.doc th,.doc td{border:1px solid #999;padding:4px 6px;background:none;color:#000;font-size:12px;text-transform:none;letter-spacing:0}
.doc .head{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
.doc .total td{font-weight:700;font-size:14px}
.doc .pay{border:1px dashed #000;padding:8px;margin-top:10px}
.doc .sig{margin-top:30px;text-align:right}
.page{page-break-after:always}
.page:last-child{page-break-after:auto}
</style>
</head>
<body>
<div id="app"><div class="loading">Učitavanje…</div></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>
<div id="print"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
'use strict';
/* ================================================================
   NAŠA ZGRADA — aplikacija za upravljanje finansijama zgrade
   ================================================================ */
const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const S = { user:null, profile:null, settings:{}, racuni:[], prostori:[], view:(location.hash.slice(1)||'pregled') };
const app = document.getElementById('app');
const $ = s => document.querySelector(s);

const ICON = `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#d98e32"/><path d="M18 52V20l14-8 14 8v32" fill="#0f3d3e"/><g fill="#f3f1ec"><rect x="23" y="24" width="6" height="6" rx="1"/><rect x="35" y="24" width="6" height="6" rx="1"/><rect x="23" y="34" width="6" height="6" rx="1"/><rect x="35" y="34" width="6" height="6" rx="1"/><rect x="29" y="44" width="6" height="8" rx="1"/></g></svg>`;

/* ---------- pomoćne ---------- */
const fmt = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const eur = n => fmt.format(Number(n)||0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MJ = ['Januar','Februar','Mart','April','Maj','Jun','Jul','Avgust','Septembar','Oktobar','Novembar','Decembar'];
const KATEGORIJE = ['Struja','Voda','Čišćenje','Lift','Održavanje','Popravke','Osiguranje','Bankarska provizija','Administracija','Investicije','Ostalo'];
const TIPOVI = {stan:'Stan',garaza:'Garaža',ostava:'Ostava',poslovni:'Poslovni prostor',ostalo:'Ostalo'};
const pad = n => String(n).padStart(2,'0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoDate(new Date());
const curMonth = () => today().slice(0,7);
const monthStart = ym => ym + '-01';
const nextMonthStart = ym => { const [y,m] = ym.split('-').map(Number); return m === 12 ? `${y+1}-01-01` : `${y}-${pad(m+1)}-01`; };
const fmtDate = d => d ? d.slice(0,10).split('-').reverse().join('.') + '.' : '';
const fmtPeriod = d => { const [y,m] = d.split('-'); return `${MJ[+m-1]} ${y}`; };
const sum = (rows, k='iznos') => rows.reduce((s,r) => s + (Number(r[k])||0), 0);
const num = v => Number(String(v).replace(',','.')) || 0;
const sortNat = (arr,k) => [...arr].sort((a,b) => String(a[k]).localeCompare(String(b[k]),'sr',{numeric:true}));
const isAdmin = () => S.profile?.uloga === 'admin';
const prostorById = id => S.prostori.find(p => p.id === id);
const glavniRacun = () => S.racuni.find(r => r.tip === 'glavni') || S.racuni[0];

function chk(res){ if (res.error) throw res.error; return res.data; }
// Supabase vraća najviše 1000 redova po upitu — ovo čita sve, stranu po stranu
async function fetchAll(build){
  const out = [];
  for (let from = 0; ; from += 1000){
    const rows = chk(await build().range(from, from + 999));
    out.push(...rows);
    if (rows.length < 1000) return out;
  }
}
function pozitivan(v){ const n = num(v); if (!(n > 0)) throw new Error('Iznos mora biti veći od nule.'); return n; }
function errMsg(e){
  if (e?.code === '23514') return 'Neispravna vrijednost (provjerite iznos).';
  if (e?.code === '23505') return 'Takav zapis već postoji.';
  if (e?.code === '23503') return 'Zapis se koristi na drugom mjestu i ne može se obrisati.';
  return e?.message || String(e);
}
let toastT;
function toast(msg, bad=false){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), bad ? 5000 : 2200);
}
const saldo = dug => {
  dug = Number(dug)||0;
  if (dug > 0.009) return `<span class="badge red">duguje ${eur(dug)}</span>`;
  if (dug < -0.009) return `<span class="badge green">preplata ${eur(-dug)}</span>`;
  return `<span class="badge grey">izmireno</span>`;
};
const empty = t => `<div class="empty">${t}</div>`;

/* ---------- forme i modal ---------- */
const field = (label, input) => `<label class="field"><span>${label}</span>${input}</label>`;
const inp = (name, val='', attrs='') => `<input name="${name}" value="${esc(val)}" ${attrs}>`;
const sel = (name, opts, val, attrs='') =>
  `<select name="${name}" ${attrs}>${opts.map(([v,l]) => `<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
const prostorOpts = () => sortNat(S.prostori,'oznaka').map(p => [p.id, `${p.oznaka}${p.vlasnik ? ' — '+p.vlasnik : ''}`]);

function closeModal(){ const m = $('#modal'); m.classList.add('hidden'); m.innerHTML = ''; }
function modal(title, body, {onSubmit, submitLabel='Sačuvaj'} = {}){
  const m = $('#modal');
  m.innerHTML = `<div class="sheet"><div class="sheet-head"><h3>${esc(title)}</h3><button class="x" type="button" data-close>×</button></div>
    <form id="mform" novalidate>${body}${onSubmit ? `<div class="actions"><button type="button" class="btn ghost" data-close>Otkaži</button><button class="btn primary" type="submit">${submitLabel}</button></div>` : ''}</form></div>`;
  m.classList.remove('hidden');
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  m.onclick = e => { if (e.target === m) closeModal(); };
  const f = m.querySelector('#mform');
  f.onsubmit = async e => {
    e.preventDefault();
    if (!onSubmit) return;
    if (!f.reportValidity()) return;
    const btn = f.querySelector('.btn.primary'); btn.disabled = true;
    try { await onSubmit(Object.fromEntries(new FormData(f)), f); }
    catch (err) { toast(errMsg(err), true); }
    finally { btn.disabled = false; }
  };
  return f;
}

function printDoc(html){
  const p = $('#print'); p.innerHTML = html;
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); p.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 80);
}
const docHead = (title, sub='') => `<div class="head"><div><h1>${esc(S.settings.naziv||'Stambena zgrada')}</h1>
  <div>${esc(S.settings.adresa||'')}${S.settings.pib ? ' · PIB '+esc(S.settings.pib) : ''}</div></div>
  <div style="text-align:right"><b>${esc(title)}</b><div>${esc(sub)}</div><div>Datum: ${fmtDate(today())}</div></div></div>`;

/* ================================================================
   AUTENTIFIKACIJA
   ================================================================ */
sb.auth.onAuthStateChange((event, session) => {
  setTimeout(() => {
    if (event === 'PASSWORD_RECOVERY') return newPassword();
    handleSession(session);
  }, 0);
});

async function handleSession(session){
  if (!session){ S.user = null; S.profile = null; return renderLogin(); }
  if (S.user && S.user.id === session.user.id && S.profile) return;
  S.user = session.user;
  try { await boot(); }
  catch (e){
    app.innerHTML = `<div class="auth"><div class="auth-card"><p class="err">${esc(errMsg(e))}</p><button class="btn" id="out">Odjava</button></div></div>`;
    $('#out').onclick = logout;
  }
}
async function logout(){ await sb.auth.signOut(); S.user = null; S.profile = null; renderLogin(); }

async function boot(){
  S.profile = chk(await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle());
  if (!S.profile) return renderNotLinked();
  await loadRef();
  if (!isAdmin() && !S.prostori.length) return renderNotLinked();
  renderShell();
}
async function loadRef(){
  S.settings = chk(await sb.from('podesavanja').select('*').eq('id',1).maybeSingle()) || {};
  S.racuni   = chk(await sb.from('racuni').select('*').order('tip').order('naziv'));
  await refreshProstori();
}
async function refreshProstori(){ S.prostori = sortNat(await fetchAll(() => sb.from('prostori').select('*').order('id')), 'oznaka'); }

function renderLogin(){
  app.innerHTML = `<div class="auth"><div class="auth-card"><div class="logo">${ICON}</div>
    <h1>Naša zgrada</h1><p class="muted">Finansije zgrade — otvoreno za sve stanare.</p>
    <form id="lf">
      ${field('Email', '<input name="email" type="email" required autocomplete="email" inputmode="email">')}
      ${field('Lozinka', '<input name="password" type="password" required minlength="6" autocomplete="current-password">')}
      <button class="btn primary block" type="submit">Prijava</button>
      <button class="btn block" type="button" id="reg">Registracija</button>
      <button class="link" type="button" id="forgot">Zaboravljena lozinka?</button>
      <p class="msg" id="msg"></p>
    </form></div></div>`;
  const f = $('#lf'), msg = t => $('#msg').textContent = t;
  const vals = () => ({ email: f.elements.email.value.trim().toLowerCase(), password: f.elements.password.value });
  f.onsubmit = async e => {
    e.preventDefault();
    const {error} = await sb.auth.signInWithPassword(vals());
    if (error) msg(error.message.includes('confirm') ? 'Email nije potvrđen — provjerite poštu.' : 'Pogrešan email ili lozinka.');
  };
  $('#reg').onclick = async () => {
    if (!f.reportValidity()) return;
    const {data, error} = await sb.auth.signUp({...vals(), options:{ emailRedirectTo: location.origin + location.pathname }});
    if (error) return msg(error.message);
    msg(data.session ? '' : 'Poslali smo link za potvrdu na vaš email. Koristite email koji ste dali upravniku.');
  };
  $('#forgot').onclick = async () => {
    const email = f.elements.email.value.trim();
    if (!email) return msg('Upišite email pa kliknite ponovo.');
    const {error} = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    msg(error ? error.message : 'Poslali smo link za novu lozinku.');
  };
}

function newPassword(){
  modal('Nova lozinka', field('Nova lozinka (min. 6 znakova)', '<input name="p" type="password" required minlength="6" autocomplete="new-password">'), {
    onSubmit: async d => { chk(await sb.auth.updateUser({ password: d.p })); closeModal(); toast('Lozinka je promijenjena.'); }
  });
}

function renderNotLinked(){
  app.innerHTML = `<div class="auth"><div class="auth-card"><div class="logo">${ICON}</div>
    <h1>Nalog nije povezan</h1>
    <p class="muted">Prijavljeni ste kao <b>${esc(S.user.email)}</b>, ali ovaj email nije upisan ni uz jedan stan.
    Javite upravniku da upiše ovaj email uz vaš stan, pa kliknite „Osvježi".</p>
    <button class="btn primary block" id="rf">Osvježi</button><button class="btn block" id="out">Odjava</button></div></div>`;
  $('#rf').onclick = () => { S.profile = null; handleSession({user:S.user}); };
  $('#out').onclick = logout;
}

/* ================================================================
   OKVIR APLIKACIJE
   ================================================================ */
const VIEWS_ADMIN = [['pregled','Pregled'],['prostori','Prostori'],['uplate','Uplate'],['rashodi','Rashodi'],
  ['zaduzenja','Zaduženja'],['dugovanja','Dugovanja'],['izvjestaji','Izvještaji'],['podesavanja','Podešavanja']];
function viewList(){
  if (isAdmin()) return VIEWS_ADMIN;
  const v = [['pregled','Pregled'],['moj','Moj račun'],['rashodi','Rashodi'],['izvjestaji','Izvještaji']];
  if (S.settings.prikazi_dugovanja) v.splice(3,0,['dugovanja','Dugovanja']);
  return v;
}
function renderShell(){
  const views = viewList();
  if (!views.some(v => v[0] === S.view)) S.view = 'pregled';
  app.innerHTML = `<header class="top"><div class="brand">${ICON}<div><b>${esc(S.settings.naziv||'Naša zgrada')}</b>
    <small>${isAdmin() ? 'Upravnik' : esc(S.prostori.map(p => p.oznaka).join(', '))}</small></div></div>
    <div class="btns"><button class="btn sm" id="pw" title="Promjena lozinke">Lozinka</button><button class="btn sm" id="out">Odjava</button></div></header>
    <nav class="tabs">${views.map(([k,l]) => `<button data-v="${k}">${l}</button>`).join('')}</nav><main id="main"></main>`;
  $('#out').onclick = logout;
  $('#pw').onclick = newPassword;
  app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => go(b.dataset.v));
  go(S.view);
}
async function go(v){
  S.view = v;
  history.replaceState(null, '', '#' + v);
  app.querySelectorAll('.tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.v === v);
    if (b.dataset.v === v) b.scrollIntoView({block:'nearest', inline:'center'});
  });
  const main = $('#main');
  main.innerHTML = '<div class="loading">Učitavanje…</div>';
  try { await VIEWS[v](main); }
  catch (e){ main.innerHTML = `<p class="err">${esc(errMsg(e))}</p>`; }
}
const rerender = () => go(S.view);
window.addEventListener('hashchange', () => {
  if (!S.profile || !$('#main')) return;
  const v = location.hash.slice(1);

const emailovi = e => String(e || '').toLowerCase().split(',').map(x => x.trim()).filter(Boolean);

/* ================================================================

   ================================================================ */
function ledger(zad, upl){
  const e = [
    ...zad.map(z => ({d:z.period, opis:`${z.opis} — ${fmtPeriod(z.period)}`, zad:+z.iznos, upl:0, t:0})),
    ...upl.map(u => ({d:u.datum, opis:u.opis || 'Uplata', zad:0, upl:+u.iznos, t:1}))
  ].sort((a,b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.t - b.t);
  let s = 0; e.forEach(x => { s += x.zad - x.upl; x.saldo = s; });
  return e.reverse();
}
function ledgerTable(zad, upl){
  const e = ledger(zad, upl);
  return `<section class="card"><div class="card-head"><h2>Kartica</h2><small>stavki: ${e.length}</small></div>
    ${e.length ? `<div class="tbl"><table><thead><tr><th>Opis</th><th class="r">Iznos</th><th class="r">Saldo</th></tr></thead><tbody>
    ${e.map(x => `<tr><td>${esc(x.opis)}<small>${fmtDate(x.d)}</small></td>
      <td class="r ${x.upl ? 'pos' : ''}">${x.upl ? '− ' + eur(x.upl) : '+ ' + eur(x.zad)}</td>
      <td class="r ${x.saldo>0.009?'neg':''}">${eur(x.saldo)}</td></tr>`).join('')}
    </tbody></table></div><div class="card-body"><small>+ zaduženje · − uplata · saldo = koliko se duguje (minus je preplata)</small></div>` : empty('Nema stavki.')}</section>`;
}
function karticaInfo(p, zad, upl){
  const dug = sum(zad) - sum(upl);
  return `<dl class="kv"><dt>Prostor</dt><dd><b>${esc(p.oznaka)}</b> · ${TIPOVI[p.tip]||p.tip}${p.povrsina ? ` · ${p.povrsina} m²` : ''}</dd>
    <dt>Vlasnik</dt><dd>${esc(p.vlasnik||'—')}</dd>
    ${p.telefon ? `<dt>Telefon</dt><dd><a href="tel:${esc(p.telefon)}">${esc(p.telefon)}</a></dd>` : ''}
    ${p.email ? `<dt>Email</dt><dd>${esc(p.email)}</dd>` : ''}
    <dt>Naknada</dt><dd>${eur(p.mjesecna_naknada)} mjesečno</dd>
    <dt>Stanje</dt><dd>${saldo(dug)}</dd>
    ${p.napomena ? `<dt>Napomena</dt><dd>${esc(p.napomena)}</dd>` : ''}</dl>`;
}
async function karticaProstora(id){
  try {
    const [p, zad, upl] = await Promise.all([
      sb.from('prostori').select('*').eq('id', id).single().then(chk),
      sb.from('zaduzenja').select('*').eq('prostor_id', id).then(chk),
      sb.from('uplate').select('*').eq('prostor_id', id).then(chk)
    ]);
    const f = modal(p.oznaka, `${karticaInfo(p, zad, upl)}
      <div class="bar"><button type="button" class="btn primary" id="ku">+ Uplata</button><button type="button" class="btn" id="ke">Uredi</button>
      <button type="button" class="btn" id="kr">Račun</button><button type="button" class="btn danger" id="kd">Obriši</button></div>
      ${ledgerTable(zad, upl)}`);
    f.querySelector('#ku').onclick = () => editUplata({}, id);
    f.querySelector('#ke').onclick = () => editProstor(p);
    f.querySelector('#kr').onclick = () => { closeModal(); stampajRacune(curMonth(), [id]); };
    f.querySelector('#kd').onclick = async () => {
      if (upl.length) return toast('Prostor ima uplate — umjesto brisanja ga označite kao neaktivan.', true);
      if (!confirm(`Obrisati ${p.oznaka} i sva njegova zaduženja?`)) return;
      try { chk(await sb.from('prostori').delete().eq('id', id)); closeModal(); toast('Obrisano'); await refreshProstori(); rerender(); }
      catch (err){ toast(errMsg(err), true); }
    };
  } catch (e){ toast(errMsg(e), true); }
}

/* ================================================================
   RAČUNI ZA ŠTAMPU
   ================================================================ */
async function stampajRacune(ym, ids){
  try {
    const start = monthStart(ym), end = nextMonthStart(ym), yStart = ym.slice(0,4) + '-01-01';
    let qp = sb.from('prostori').select('*');
    qp = ids ? qp.in('id', ids) : qp.eq('aktivan', true);
    const [pr, zadAll, uplAll] = await Promise.all([
      qp.then(chk),
      fetchAll(() => sb.from('zaduzenja').select('*').lt('period', end).order('id')),
      fetchAll(() => sb.from('uplate').select('*').lt('datum', end).order('id'))
    ]);
    if (!pr.length) return toast('Nema prostora za štampu.', true);
    const g = glavniRacun();
    const pages = sortNat(pr, 'oznaka').map(p => {
      const zad = zadAll.filter(z => z.prostor_id === p.id), upl = uplAll.filter(u => u.prostor_id === p.id);
      const ovaj = zad.filter(z => z.period === start);
      const prethodno = sum(zad.filter(z => z.period < start)) - sum(upl);
      const zaUplatu = Math.max(0, prethodno + sum(ovaj));
      const ist = upl.filter(u => u.datum >= yStart).sort((a,b) => a.datum < b.datum ? -1 : 1);
      return `<div class="page doc">${docHead('RAČUN ZA ODRŽAVANJE ZGRADE', `Br. ${ym.replace('-','')}-${p.oznaka}`)}
        <table><tbody><tr><th style="width:35%">Prostor</th><td>${esc(p.oznaka)} (${TIPOVI[p.tip]||p.tip})</td></tr>
        <tr><th>Vlasnik / korisnik</th><td>${esc(p.vlasnik||'')}</td></tr><tr><th>Obračunski period</th><td>${fmtPeriod(start)}</td></tr></tbody></table>
        <h2>Obračun</h2><table><thead><tr><th>Stavka</th><th style="width:30%">Iznos</th></tr></thead><tbody>
        ${ovaj.map(z => `<tr><td>${esc(z.opis)} — ${fmtPeriod(start)}</td><td>${eur(z.iznos)}</td></tr>`).join('') || `<tr><td>Nema zaduženja za ovaj mjesec</td><td>${eur(0)}</td></tr>`}
        <tr><td>${prethodno >= 0 ? 'Dug iz prethodnog perioda' : 'Preplata iz prethodnog perioda'}</td><td>${prethodno >= 0 ? eur(prethodno) : '− ' + eur(-prethodno)}</td></tr>
        <tr class="total"><td>UKUPNO ZA UPLATU</td><td>${eur(zaUplatu)}</td></tr></tbody></table>
        <div class="pay"><b>Podaci za uplatu</b><br>Primalac: ${esc(S.settings.naziv||'')}${S.settings.adresa ? ', ' + esc(S.settings.adresa) : ''}<br>
        Žiroračun: <b>${esc(g?.broj||'—')}</b><br>Svrha: Održavanje zgrade ${fmtPeriod(start)}<br>Poziv na broj: <b>${esc(p.oznaka)}</b><br>Iznos: <b>${eur(zaUplatu)}</b></div>
        ${S.settings.napomena_racuna ? `<p>${esc(S.settings.napomena_racuna)}</p>` : ''}
        <h2>Uplate u ${ym.slice(0,4)}. godini</h2>
        ${ist.length ? `<table><thead><tr><th>Datum</th><th>Opis</th><th>Iznos</th></tr></thead><tbody>
          ${ist.map(u => `<tr><td>${fmtDate(u.datum)}</td><td>${esc(u.opis||'Uplata')}</td><td>${eur(u.iznos)}</td></tr>`).join('')}
          <tr class="total"><td colspan="2">Ukupno uplaćeno</td><td>${eur(sum(ist))}</td></tr></tbody></table>` : '<p>Nema uplata u ovoj godini.</p>'}
        <div class="sig">Upravnik: ${esc(S.settings.upravnik||'')}${S.settings.telefon ? ' · ' + esc(S.settings.telefon) : ''}</div></div>`;
    });
    printDoc(pages.join(''));
  } catch (e){ toast(errMsg(e), true); }
}

/* ================================================================
   REZERVNA KOPIJA
   ================================================================ */
async function backup(){
  try {
    const tabele = ['podesavanja','racuni','prostori','zaduzenja','uplate','rashodi','profiles'];
    const out = { izvezeno: new Date().toISOString() };
    for (const t of tabele) out[t] = await fetchAll(() => sb.from(t).select('*').order('id'));
    const blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `zgrada-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Rezervna kopija preuzeta');
  } catch (e){ toast(errMsg(e), true); }
}
